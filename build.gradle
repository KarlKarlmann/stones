plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

// Version aus gradle.properties laden (Fallback auf 1.0.0, falls nicht gefunden)
version = project.hasProperty('mod_version') ? project.getProperty('mod_version') : '1.0.0'
group = 'net.stones'
archivesBaseName = 'stones'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

	runs {
		client {
			workingDirectory project.file('run')
			property 'mixin.env.disableRefMap', 'true'
			arg "-mixin.config=stones.mixins.json"
			mods { stones { source sourceSets.main } }
		}
		server {
			workingDirectory project.file('run')
			property 'mixin.env.disableRefMap', 'true'
			arg "-mixin.config=stones.mixins.json"
			mods { stones { source sourceSets.main } }
		}
	}
}

mixin {
    add sourceSets.main, 'stones.refmap.json'
    config 'stones.mixins.json'
}

repositories {
    // Jared's maven wurde entfernt, da wir JEI nicht mehr benötigen.
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    // Scannt den "libs" Ordner automatisch nach ALLEN .jar Dateien und bindet sie ein!
	implementation fg.deobf(fileTree(dir: 'libs', include: '*.jar'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- WICHTIG 1: Variablen in der mods.toml ersetzen ---
def replaceProperties = [
        version: project.version,
        mod_version: project.version
]

processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// --- WICHTIG 2: Mod Manifest mit sauberen FML-Daten ---
tasks.named('jar', Jar).configure {
    archiveFileName = "stones_1.20.1_forge_${project.version}.jar"

    manifest {
        attributes([
            "Specification-Title"     : "Stones",
            "Specification-Vendor"    : "Stones",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "Stones",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "stones.mixins.json"
        ])
    }
}

// --- WICHTIG 3: Reobfuscation für das fertige Spiel aktivieren! ---
jar.finalizedBy('reobfJar')

if (file('local-git.gradle').exists()) {
    apply from: 'local-git.gradle'
}

// ============================================================
// Füge diesen Block am Ende von Stones' build.gradle ein
// und passe die Pfade unten an deine Umgebung an.
// ============================================================

// --- ANPASSEN: an deine Umgebung ---
def instanceModsDir  = 'E:/PrismLauncher/instances/StonesTest/minecraft/mods'
def prismLauncherExe = 'E:/PrismLauncher/prismlauncher.exe'
def instanceId        = 'StonesTest'   // Ordnername der Instanz

def serverDir         = 'E:/StonesTestServer'
def serverModsDir     = "${serverDir}/mods"

// Eine Liste der Dateien, die jeweils synct werden sollen:
// 1) die frisch gebaute & reobfuskierte Stones-Jar
// 2) ALLES, was in libs/ liegt (Actionbar + jede weitere Dependency-Jar)
def filesToSync = {
    [tasks.named('jar').get().archiveFile.get().asFile] +
    fileTree(dir: 'libs', include: '*.jar').files
}

// ---------------- CLIENT ----------------
tasks.register('syncModsToInstance', Copy) {
    dependsOn tasks.named('reobfJar')

    doFirst {
        // alte Stones- und libs-Jars im Ziel-mods-Ordner entfernen,
        // damit keine veralteten Doppel-Versionen rumliegen
        def names = filesToSync().collect { it.name }
        fileTree(instanceModsDir).matching {
            include names
        }.each { it.delete() }
    }

    from(filesToSync())
    into instanceModsDir
}

tasks.register('runVanilla', Exec) {
    dependsOn 'syncModsToInstance'
    commandLine prismLauncherExe, '-l', instanceId
}

// ---------------- SERVER ----------------
tasks.register('syncModsToServer', Copy) {
    dependsOn tasks.named('reobfJar')

    doFirst {
        def names = filesToSync().collect { it.name }
        fileTree(serverModsDir).matching {
            include names
        }.each { it.delete() }
    }

    from(filesToSync())
    into serverModsDir
}

tasks.register('runServerVanilla', Exec) {
    dependsOn 'syncModsToServer'
    workingDir serverDir
    commandLine 'cmd', '/c', 'run.bat'
}