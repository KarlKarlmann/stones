plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

// Version aus gradle.properties laden (Fallback auf 1.0.0, falls nicht gefunden)
version = project.hasProperty('mod_version') ? project.getProperty('mod_version') : '1.0.0'
group = 'net.stones'
archivesBaseName = 'stones'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // Falls du eine Access Transformer cfg hast, einkommentieren:
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=stones.mixins.json"
            mods { stones { source sourceSets.main } }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=stones.mixins.json"
            mods { stones { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'stones.refmap.json'
    config 'stones.mixins.json'
}

repositories {
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    compileOnly fg.deobf("mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${jei_mc_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${jei_mc_version}-common:${jei_version}")
    
    runtimeOnly fg.deobf("mezz.jei:jei-${jei_mc_version}-forge:${jei_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- WICHTIG 1: Variablen in der mods.toml ersetzen ---
def replaceProperties = [
        version: project.version,
        mod_version: project.version
]

processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// --- WICHTIG 2: Mod Manifest mit sauberen FML-Daten ---
tasks.named('jar', Jar).configure {
    archiveFileName = "stones_1.20.1_forge_${project.version}.jar"

    manifest {
        attributes([
            "Specification-Title"     : "Stones",
            "Specification-Vendor"    : "Stones",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "Stones",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "stones.mixins.json"
        ])
    }
}

// --- WICHTIG 3: Reobfuscation für das fertige Spiel aktivieren! ---
jar.finalizedBy('reobfJar')

if (file('local-git.gradle').exists()) {
    apply from: 'local-git.gradle'
}