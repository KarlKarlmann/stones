// ============================================================
// LOKALE TEST-UMGEBUNG (Wird von Git ignoriert)
// ============================================================

def instanceModsDir  = 'E:/PrismLauncher/instances/StonesTest/minecraft/mods'
def prismLauncherExe = 'E:/PrismLauncher/prismlauncher.exe'
def instanceId       = 'StonesTest'

def serverDir        = 'E:/StonesTestServer'
def serverModsDir    = "${serverDir}/mods"

// Synchronisiert NUR noch das gebaute Mod-JAR (libs-Ordner wird ignoriert)
def filesToSync = {
    [tasks.named('jar').get().archiveFile.get().asFile]
}

// Extrahiert den reinen Mod-Namen ohne Version (z.B. "stones-1.0.23" -> "stones")
def getBaseNames = {
    filesToSync().collect { file ->
        def nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'))
        // Trennt beim ersten Bindestrich gefolgt von einer Zahl ab
        def parts = nameWithoutExt.split(/-\d/)
        return parts[0]
    }
}

// ---------------- CLIENT ----------------
tasks.register('syncModsToInstance', Copy) {
    dependsOn tasks.named('reobfJar')

    doFirst {
        def baseNames = getBaseNames()
        fileTree(instanceModsDir).matching {
            baseNames.each { base ->
                include "${base}-*.jar"
                include "${base}.jar"
            }
        }.each { it.delete() }
    }

    from(filesToSync())
    into instanceModsDir
}

tasks.register('runVanilla', Exec) {
    dependsOn 'syncModsToInstance'
    commandLine prismLauncherExe, '-l', instanceId
}

// ---------------- SERVER ----------------
tasks.register('syncModsToServer', Copy) {
    dependsOn tasks.named('reobfJar')

    doFirst {
        def baseNames = getBaseNames()
        fileTree(serverModsDir).matching {
            baseNames.each { base ->
                include "${base}-*.jar"
                include "${base}.jar"
            }
        }.each { it.delete() }
    }

    from(filesToSync())
    into serverModsDir
}

tasks.register('runServerVanilla', Exec) {
    dependsOn 'syncModsToServer'
    workingDir serverDir
    commandLine 'cmd', '/c', 'run.bat'
}